<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genes as Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one slim title bar, then a single stage. The figure sits in the stage; hotspot popups open over it, so the page never grows taller than the stage. */
:root {
  --bg: #f7f4f5;
  --surface: #ffffff;
  --ink: #201719;
  --muted: #65565a;
  --line: #e4d9dc;
  --pink: #f8d2d8;
  --red: #d3212f;
  --brown: #7b2e0d;
  --orange: #f0a032;
  --orange-ink: #3a2200;
  --green: #9ae35f;
  --green-edge: #4d8f26;
  --doc-blue: #cfe2f7;
  --doc-pink: #f6cae5;
  --doc-edge: #7d8fa6;
  --purple: #bd63a9;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-head: 'Space Grotesk', 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161113; --surface: #211a1d; --ink: #f4eaec; --muted: #b9a8ad; --line: #3a2e32;
    --pink: #4a2830; --red: #ff6877; --brown: #f0a27a; --orange: #f4ac45; --orange-ink: #1d1100;
    --green: #7fd24a; --green-edge: #a9ee7a; --doc-blue: #2e4560; --doc-pink: #5b3350; --doc-edge: #8aa0ba; --purple: #d58bc4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161113; --surface: #211a1d; --ink: #f4eaec; --muted: #b9a8ad; --line: #3a2e32;
  --pink: #4a2830; --red: #ff6877; --brown: #f0a27a; --orange: #f4ac45; --orange-ink: #1d1100;
  --green: #7fd24a; --green-edge: #a9ee7a; --doc-blue: #2e4560; --doc-pink: #5b3350; --doc-edge: #8aa0ba; --purple: #d58bc4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
.wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
h1, h2 { font-family: var(--font-head); line-height: 1.25; text-wrap: balance; margin: 0; }
h1 { font-size: 1rem; font-weight: 700; }
h2 { font-size: 1.1rem; font-weight: 700; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 14px; }
.bar-right { display: flex; align-items: center; gap: 12px; }
.hint { font-size: .8rem; color: var(--muted); }
.btn {
  font: inherit; font-size: .85rem; font-weight: 500; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 7px; padding: 5px 12px; cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--orange); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.stage {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  min-height: 380px; display: flex; align-items: center; overflow: hidden; padding: 8px 10px;
}
.stage svg.fig { display: block; width: 100%; height: auto; }

/* figure svg */
.t { font-family: var(--font-body); fill: var(--ink); font-style: italic; }
.t-b { font-weight: 700; }
.t-label { font-size: 22px; }
.t-word { font-size: 22px; }
.band { fill: var(--pink); }
.band-line { stroke: var(--red); stroke-width: 1.5; }
.arrow-up { fill: none; stroke: var(--red); stroke-width: 2.4; }
.arrow-down { fill: none; stroke: var(--brown); stroke-width: 2.4; stroke-dasharray: 7 5; }
.mk-red { fill: var(--red); }
.mk-brown { fill: var(--brown); }
.page-edge { stroke: color-mix(in srgb, var(--ink) 55%, transparent); stroke-width: 1; }
.page-fill { fill: var(--pink); }
.page-line { stroke: color-mix(in srgb, var(--ink) 65%, transparent); stroke-width: 2; }
.clip { fill: #2a2224; }
.purple { fill: none; stroke: var(--purple); stroke-width: 7; stroke-linecap: round; }
.mk-purple { fill: var(--purple); }
.hs { cursor: pointer; outline: none; }
.hs-box { fill: transparent; stroke: var(--orange); stroke-width: 3.5; transition: fill .15s; }
.hs:hover .hs-box { fill: color-mix(in srgb, var(--orange) 22%, transparent); }
.hs:focus-visible .hs-box { stroke: var(--ink); stroke-dasharray: 6 4; }
.hs[aria-pressed="true"] .hs-box { fill: color-mix(in srgb, var(--orange) 30%, transparent); stroke-width: 5; }
.hs-badge { fill: var(--orange); }
.hs-num { fill: var(--orange-ink); font-family: var(--font-head); font-weight: 700; font-size: 15px; text-anchor: middle; }

/* popup */
.overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 10px;
  background: color-mix(in srgb, var(--ink) 48%, transparent);
}
.overlay[hidden] { display: none; }
.dialog {
  background: var(--surface); border-radius: 9px; width: 100%; max-width: 900px; max-height: 100%;
  display: flex; flex-direction: column; box-shadow: 0 8px 30px rgba(0,0,0,.28);
}
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px 6px; }
.dlg-head h2 { display: flex; align-items: center; gap: 9px; }
.dlg-n {
  width: 24px; height: 24px; border-radius: 50%; background: var(--orange); color: var(--orange-ink);
  display: inline-grid; place-items: center; font-size: .85rem; flex: none;
}
.dlg-body { overflow: auto; padding: 0 14px 8px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.dlg-body.single { grid-template-columns: minmax(0, 1fr); }
.dlg-body > * { min-width: 0; }
.dlg-text p { margin: 0 0 8px; font-size: .92rem; line-height: 1.5; }
.dlg-diagram { background: color-mix(in srgb, var(--bg) 60%, var(--surface)); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.dlg-diagram svg { display: block; width: 100%; height: auto; }
.dlg-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 14px 10px; border-top: 1px solid var(--line); }
.dlg-foot .count { font-size: .8rem; color: var(--muted); }
.dlg-foot .grp { display: flex; gap: 8px; }
@media (max-width: 660px) { .dlg-body { grid-template-columns: minmax(0, 1fr); } }

/* diagram svg */
.d-label { font-family: var(--font-body); font-size: 14px; fill: var(--ink); }
.d-label-i { font-style: italic; }
.d-base { font-family: var(--font-head); font-weight: 700; font-size: 19px; fill: #fff; text-anchor: middle; }
.d-strand { fill: #c9283a; }
.d-mutbox { fill: none; stroke: var(--ink); stroke-width: 2.5; }
.d-arrow { fill: none; stroke: var(--brown); stroke-width: 2; }
.d-doc-blue { fill: var(--doc-blue); stroke: var(--doc-edge); stroke-width: 1; }
.d-doc-pink { fill: var(--doc-pink); stroke: var(--doc-edge); stroke-width: 1; }
.d-line { stroke: var(--doc-edge); stroke-width: 2; }
.d-mark-blue { fill: #3f7fd0; }
.d-mark-pink { fill: #c0489d; }
.d-chip-blue { fill: var(--doc-blue); stroke: var(--doc-edge); }
.d-chip-pink { fill: var(--doc-pink); stroke: var(--doc-edge); }
.d-chip-text { font-family: var(--font-body); font-size: 20px; fill: var(--ink); text-anchor: middle; font-style: italic; }
.d-protein { fill: var(--green); stroke: var(--green-edge); stroke-width: 2; }
.d-protein-bad { fill: color-mix(in srgb, var(--green) 35%, var(--surface)); stroke: var(--green-edge); stroke-width: 2; stroke-dasharray: 5 4; }
.d-crack { fill: none; stroke: var(--green-edge); stroke-width: 2; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<main class="wrap">
  <div class="bar">
    <h1>Figure 8.3 Genes as words in an instruction manual</h1>
    <div class="bar-right">
      <span class="hint">Select the numbered boxes in order, 1 to 4.</span>
      <button class="btn" id="introBtn" type="button">Introduction</button>
    </div>
  </div>
  <div class="stage" id="stage">
    <div id="figure" style="width:100%"></div>
    <div class="overlay" id="overlay" hidden></div>
  </div>
</main>

<script>
/* ---- Content. Edit words and sentences here. ---- */
var GRAY = 'gray';      /* spelling used in the figure and as the original word in step 2 */
var GREY = 'grey';      /* the mutant spelling shown in step 2 */
var MIDDLE = ['build', 'grow', 'long', 'dark', 'blood', GRAY, 'strong', 'hair', 'for', 'eyes', 'nerve', 'small', 'red', 'tissue'];
var NERVE = ['build', 'strong', 'nerve', 'tissue'];
var EYE = ['build', 'dark', GRAY, 'eyes'];
var NORMAL_TOP = 'ACTAATGAA', NORMAL_BOT = 'TGATTACTT';

var INTRO = [
  'The instruction manual inside a cell is different from the instruction manual that comes with ready-to-assemble furniture. You would read the manual for building your bookshelf beginning at page 1 and follow an orderly set of steps to produce the final product.',
  'A biological instruction manual is much more complicated—the pages and words to be read are different for different types of cells and may even change according to the situation. For example, some genes are expressed in a nerve cell while different genes might be expressed in an eye cell. The final product of any given cell depends on the words used and the order in which the words are read from this common instruction manual.',
  'The analogy of genes being similar to the words in an instruction manual helps us to understand how the chemical structure of genes carries the information for building proteins. We can also see how changes to the DNA, in the form of mutations, can have an impact on the resulting protein and thus the final product of those instructions.',
  'Explore this interactive figure to gain a deeper understanding of how the DNA in our cells functions as an instruction manual, and how mutations can affect those instructions. Select the hotspots in the numeric order indicated.'
];

var STEPS = [
  { name: 'Instruction Manual',
    text: 'Genes are carried on strands of DNA, which is made up of sequences of chemicals called “bases.” There are four DNA bases, and each is represented by a single letter code—A, T, C, and G. These DNA bases are arranged in a specific sequence that “spells out” a specific protein. Using the analogy of an instruction manual, it’s like the DNA is the word on the page and the protein is what would be produced as a result of using that word in a sentence. Proteins are the essential building blocks and tools involved in the growth, development, reproduction, or maintenance of an organism.',
    top: NORMAL_TOP, bot: NORMAL_BOT, mut: -1, protein: 'good', proteinLabel: ['Functional', 'protein'],
    docs: 'single', orig: 'strong', tint: 'blue',
    alt: 'A normal DNA sequence of A C T A A T G A A and its complementary strand of T G A T T A C T T yields a functional protein.' },
  { name: 'Neutral Mutation',
    text: 'In the process of passing on instructions from a parent cell to a daughter cell, all the DNA is copied. And like any effort to transcribe information, sometimes errors occur. The effects of these errors, called mutations, can vary. In one type of mutation, called a neutral mutation, the change of a base results in an allele that functions the same as the original allele; therefore, there is no change in the function of the protein. In our analogy of an instruction manual, this is like the normal allele spelling out “' + GRAY + '” and the mutant allele spelling out “' + GREY + ',” with both signifying the same color.',
    top: 'ACTAACGAA', bot: 'TGATTGCTT', mut: 5, protein: 'good', proteinLabel: ['Functional', 'protein'],
    docs: 'pair', orig: GRAY, copy: GREY, tint: 'blue',
    alt: 'A single base change in the DNA sequence. In the diagram of an original document and a copy, the word ' + GRAY + ' in the original becomes ' + GREY + ' in the copy. The mutant allele has the same meaning as the normal allele, so the protein is still functional.' },
  { name: 'Missense Mutation',
    text: 'In another type of mutation, called a “missense mutation,” the change of a base results in an allele that functions differently from the original allele, resulting in a change in the function of the protein. While such changes often result in problems with development and growth, they can sometimes lead to brand new traits that are beneficial to the organism. In our instruction manual analogy, this type of error would result in a new, entirely different word, such as replacing “strong” with “string.” Instructions using this word might be impossible to follow, but also might result in a novel outcome compared to the original instructions.',
    top: 'ACTAGTGAA', bot: 'TGATCACTT', mut: 4, protein: 'different', proteinLabel: ['Protein with', 'different', 'function'],
    docs: 'pair', orig: 'strong', copy: 'string', tint: 'pink',
    alt: 'A single base change in the DNA sequence. In the diagram of an original document and a copy, the word strong becomes string. The mutant allele has a different meaning, so the protein has a different function.' },
  { name: 'Nonsense Mutation',
    text: 'In still another type of mutation, called a “nonsense mutation,” the change of a base results in an allele that produces a protein that cannot function properly, or in no protein at all. In our instruction manual analogy, this type of error results in a nonsense word—“nzrve” rather than “nerve”—where the instructions using this word would be impossible to follow.',
    top: 'ACTAATTAA', bot: 'TGATTAATT', mut: 6, protein: 'bad', proteinLabel: ['Nonfunctional', 'protein'],
    docs: 'pair', orig: 'nerve', copy: 'nzrve', tint: 'blue',
    alt: 'A single base change in the DNA sequence. In the diagram of an original document and a copy, the word nerve becomes the nonsense word nzrve. The mutant allele has no meaning, so the protein is nonfunctional.' }
];

/* ---- Figure ---- */
var FIG_ALT = 'A comparison of genes to words in an instruction manual, with meanings that vary based on context. A list of words is shown: ' + MIDDLE.join(', ') + '. Genes expressed in a nerve cell use the words ' + NERVE.join(', ') + ' from that list. Genes expressed in an eye cell use the words ' + EYE.join(', ') + '. The same list produces different outcomes depending on which words are read.';
var TOP_C = [500, 610, 720, 830], BOT_C = [345, 455, 565, 675];

function rowWords(list, centers, y) {
  return list.map(function (w, k) {
    return '<text class="t t-word t-b" x="' + centers[k] + '" y="' + y + '" text-anchor="middle">' + w + '</text>';
  }).join('');
}

function buildFigure() {
  var expressed = {};
  NERVE.concat(EYE).forEach(function (w) { expressed[w] = true; });

  var strip = '<rect class="band" id="sb" x="190" y="160" width="870" height="40"/>' +
    '<line class="band-line" id="sl1" x1="190" y1="160" x2="1060" y2="160"/><line class="band-line" id="sl2" x1="190" y1="200" x2="1060" y2="200"/>';
  MIDDLE.forEach(function (w, i) {
    strip += '<text id="w' + i + '" class="t t-word' + (expressed[w] ? ' t-b' : '') + '" x="0" y="187" text-anchor="middle">' + w + '</text>';
  });
  var arrows = NERVE.map(function (w, k) { return '<path class="arrow-up" id="u' + k + '" d="" marker-end="url(#mkRed)"/>'; }).join('') +
    EYE.map(function (w, k) { return '<path class="arrow-down" id="d' + k + '" d="" marker-end="url(#mkBrown)"/>'; }).join('');

  var manual =
    '<g transform="translate(0 -52)">' +
    [4, 3, 2, 1].map(function (o) { return '<rect class="page-fill page-edge" x="' + (30 - o) + '" y="' + (146 + o) + '" width="125" height="200" transform="rotate(-5 92 246)"/>'; }).join('') +
    '<g transform="rotate(-5 92 246)">' +
    '<rect class="page-fill page-edge" x="30" y="146" width="125" height="200"/>' +
    '<rect class="clip" x="44" y="134" width="30" height="22" rx="2"/><rect class="clip" x="52" y="150" width="14" height="14" rx="3" opacity=".5"/>' +
    '<text class="t" x="92" y="190" text-anchor="middle" font-size="15" style="font-style:normal">INSTRUCTION</text>' +
    '<text class="t" x="92" y="208" text-anchor="middle" font-size="15" style="font-style:normal">MANUAL</text>' +
    [226, 236, 246, 256, 272, 282, 292, 302].map(function (y, k) { return '<line class="page-line" x1="45" y1="' + y + '" x2="' + (k % 4 === 3 ? 100 : 142) + '" y2="' + y + '"/>'; }).join('') +
    '<line x1="45" y1="322" x2="140" y2="322" stroke="#d3212f" stroke-width="5"/>' +
    '<text class="t" x="144" y="338" font-size="9" style="font-style:normal">1</text>' +
    '</g>' +
    '<path class="purple" d="M118 318 C112 258 150 232 178 228"/>' +
    '<path class="mk-purple" d="M190 224 L170 212 L172 236 Z"/>' +
    '</g>';

  var hs = [
    { i: 0, x: 14, y: 62, w: 168, h: 250, label: 'Hotspot 1: Instruction Manual' },
    { i: 1, x: 523, y: 266, w: 84, h: 48, label: 'Hotspot 2: Neutral Mutation, the word ' + GRAY },
    { i: 2, x: 568, y: 34, w: 84, h: 48, label: 'Hotspot 3: Missense Mutation, the word strong' },
    { i: 3, x: 678, y: 34, w: 84, h: 48, label: 'Hotspot 4: Nonsense Mutation, the word nerve' }
  ].map(function (h) {
    return '<g class="hs" data-i="' + h.i + '" role="button" tabindex="0" aria-pressed="false" aria-label="' + h.label + '">' +
      '<rect class="hs-box" x="' + h.x + '" y="' + h.y + '" width="' + h.w + '" height="' + h.h + '" rx="3"/>' +
      '<circle class="hs-badge" cx="' + (h.x + h.w) + '" cy="' + h.y + '" r="13"/>' +
      '<text class="hs-num" x="' + (h.x + h.w) + '" y="' + (h.y + 5.5) + '">' + (h.i + 1) + '</text></g>';
  }).join('');

  return '<svg class="fig" viewBox="0 0 1100 356" role="group" aria-label="' + FIG_ALT.replace(/"/g, '&quot;') + '">' +
    '<defs>' +
    '<marker id="mkRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-red" d="M0 0 L10 5 L0 10 Z"/></marker>' +
    '<marker id="mkBrown" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-brown" d="M0 0 L10 5 L0 10 Z"/></marker>' +
    '</defs>' +
    '<text class="t t-label" x="665" y="24" text-anchor="middle">Genes expressed in nerve cell</text>' +
    '<rect class="band" x="440" y="38" width="450" height="40"/><line class="band-line" x1="440" y1="38" x2="890" y2="38"/><line class="band-line" x1="440" y1="78" x2="890" y2="78"/>' +
    rowWords(NERVE, TOP_C, 66) + arrows + strip +
    '<rect class="band" x="300" y="270" width="440" height="40"/><line class="band-line" x1="300" y1="270" x2="740" y2="270"/><line class="band-line" x1="300" y1="310" x2="740" y2="310"/>' +
    rowWords(EYE, BOT_C, 298) +
    '<text class="t t-label" x="520" y="340" text-anchor="middle">Genes expressed in eye cell</text>' +
    manual + hs + '</svg>';
}

/* Even word spacing in the middle strip: measure each word, then place them with one gap. */
function layoutStrip() {
  var svg = figEl.querySelector('svg');
  if (!svg) return;
  var lens = MIDDLE.map(function (w, i) { return svg.querySelector('#w' + i).getComputedTextLength(); });
  var sum = lens.reduce(function (a, b) { return a + b; }, 0);
  var gap = Math.max(8, Math.min(15, (870 - 28 - sum) / (MIDDLE.length - 1)));
  var x = 204, pos = [];
  MIDDLE.forEach(function (w, i) {
    pos[i] = x + lens[i] / 2;
    svg.querySelector('#w' + i).setAttribute('x', pos[i]);
    x += lens[i] + gap;
  });
  var right = x - gap + 14;
  svg.querySelector('#sb').setAttribute('width', right - 190);
  svg.querySelector('#sl1').setAttribute('x2', right);
  svg.querySelector('#sl2').setAttribute('x2', right);
  NERVE.forEach(function (w, k) {
    var sx = pos[MIDDLE.indexOf(w)], tx = TOP_C[k];
    svg.querySelector('#u' + k).setAttribute('d', 'M' + sx + ' 160 C' + sx + ' 125 ' + tx + ' 120 ' + tx + ' 86');
  });
  EYE.forEach(function (w, k) {
    var sx = pos[MIDDLE.indexOf(w)], tx = BOT_C[k];
    svg.querySelector('#d' + k).setAttribute('d', 'M' + sx + ' 200 C' + sx + ' 235 ' + tx + ' 228 ' + tx + ' 262');
  });
}

/* ---- Popup diagram ---- */
var BLOBS = {
  good: 'M20 55 C5 30 35 5 60 15 C80 5 110 20 105 45 C118 70 90 95 60 90 C35 100 5 85 20 55Z',
  different: 'M30 20 C50 0 70 25 90 15 C115 30 100 55 110 70 C95 95 60 80 40 95 C10 85 25 60 12 45 C5 30 20 28 30 20Z',
  bad: 'M10 60 C0 35 30 30 35 15 C55 0 70 20 90 12 C110 20 105 45 115 60 C105 85 80 80 60 95 C35 90 20 90 10 60Z'
};

function docSvg(x, y, rot, cls, markCls, hasMark) {
  var cxm = x + 46, cym = y + 56;
  var lines = [18, 30, 42, 54, 66, 78, 90].map(function (dy, k) {
    return '<line class="d-line" x1="' + (x + 10) + '" y1="' + (y + dy) + '" x2="' + (x + (k % 3 === 2 ? 52 : 82)) + '" y2="' + (y + dy) + '"/>';
  }).join('');
  var mark = hasMark ? '<rect class="' + markCls + '" x="' + (x + 10) + '" y="' + (y + 52) + '" width="32" height="5" rx="1"/>' : '';
  return '<g transform="rotate(' + rot + ' ' + cxm + ' ' + cym + ')"><rect class="' + cls + '" x="' + x + '" y="' + y + '" width="92" height="112"/>' + lines + mark + '</g>';
}

function chip(x, y, w, text, cls, bold) {
  return '<rect class="' + cls + '" x="' + x + '" y="' + y + '" width="' + w + '" height="34" rx="2"/>' +
    '<text class="d-chip-text" x="' + (x + w / 2) + '" y="' + (y + 24) + '"' + (bold ? ' style="font-weight:700"' : '') + '>' + text + '</text>';
}

function buildDiagram(s) {
  var x0 = 84, dx = 30, i, out = '';
  var docCls = s.tint === 'pink' ? 'd-doc-pink' : 'd-doc-blue';
  var chipCls = s.tint === 'pink' ? 'd-chip-pink' : 'd-chip-blue';
  var markCls = s.tint === 'pink' ? 'd-mark-pink' : 'd-mark-blue';

  out += '<text class="d-label" x="10" y="44">DNA</text>';
  out += '<rect class="d-strand" x="70" y="24" width="' + (9 * dx + 14) + '" height="32"/>';
  out += '<rect class="d-strand" x="70" y="62" width="' + (9 * dx + 14) + '" height="32"/>';
  for (i = 0; i < 9; i++) {
    out += '<text class="d-base" x="' + (x0 + i * dx) + '" y="47">' + s.top.charAt(i) + '</text>';
    out += '<text class="d-base" x="' + (x0 + i * dx) + '" y="85">' + s.bot.charAt(i) + '</text>';
  }
  if (s.mut >= 0) {
    var bx = x0 + s.mut * dx;
    out += '<rect class="d-mutbox" x="' + (bx - 15) + '" y="20" width="30" height="78"/>';
    out += '<text class="d-label d-label-i" x="' + bx + '" y="14" text-anchor="middle">Mutation</text>';
  }
  out += '<path class="d-arrow" d="M213 102 L213 146"/><path class="mk-brown" d="M205 144 L221 144 L213 156 Z"/>';
  out += '<g transform="translate(150 158)"><path class="' + (s.protein === 'bad' ? 'd-protein-bad' : 'd-protein') + '" d="' + BLOBS[s.protein] + '"/>' +
    (s.protein === 'bad' ? '<path class="d-crack" d="M45 25 L58 45 L50 60 L66 78"/>' : '') + '</g>';
  s.proteinLabel.forEach(function (ln, k) {
    out += '<text class="d-label" x="282" y="' + (196 - (s.proteinLabel.length - 2) * 8 + k * 17) + '">' + ln + '</text>';
  });

  if (s.docs === 'pair') {
    out += '<text class="d-label d-label-i" x="428" y="20" text-anchor="middle">Original</text>';
    out += '<text class="d-label d-label-i" x="552" y="20" text-anchor="middle">Copy</text>';
    out += docSvg(384, 30, -5, docCls, markCls, true) + docSvg(508, 30, 5, docCls, markCls, true);
    out += '<path class="d-arrow" d="M430 148 L430 176"/><path class="mk-brown" d="M424 174 L436 174 L430 184 Z"/>';
    out += '<path class="d-arrow" d="M554 148 L554 176"/><path class="mk-brown" d="M548 174 L560 174 L554 184 Z"/>';
    out += chip(380, 188, 100, s.orig, chipCls, false);
    out += chip(504, 188, 100, s.copy, chipCls, true);
    out += '<path class="d-arrow" d="M482 205 L500 205"/><path class="mk-brown" d="M498 199 L498 211 L508 205 Z"/>';
  } else {
    out += '<text class="d-label d-label-i" x="470" y="20" text-anchor="middle">Page</text>';
    out += docSvg(424, 30, 0, docCls, markCls, true);
    out += '<path class="d-arrow" d="M470 148 L470 176"/><path class="mk-brown" d="M464 174 L476 174 L470 184 Z"/>';
    out += chip(420, 188, 100, s.orig, chipCls, true);
  }
  return '<svg viewBox="0 0 660 236" role="img" aria-label="' + s.alt.replace(/"/g, '&quot;') + '">' + out + '</svg>';
}

/* ---- Behaviour ---- */
var cur = -1, lastFocus = null;
var figEl = document.getElementById('figure');
var overlay = document.getElementById('overlay');
var introBtn = document.getElementById('introBtn');

figEl.innerHTML = buildFigure();
layoutStrip();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutStrip);

function setPressed(i) {
  Array.prototype.forEach.call(figEl.querySelectorAll('.hs'), function (g) {
    g.setAttribute('aria-pressed', String(Number(g.getAttribute('data-i')) === i));
  });
}

function closeDialog() {
  overlay.hidden = true;
  overlay.innerHTML = '';
  cur = -1;
  setPressed(-1);
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

function openIntro() {
  lastFocus = document.activeElement;
  cur = -1;
  setPressed(-1);
  overlay.innerHTML = '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">' +
    '<div class="dlg-head"><h2 id="dlgTitle">Introduction</h2><button class="btn" type="button" data-act="close">Close</button></div>' +
    '<div class="dlg-body single"><div class="dlg-text">' + INTRO.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div></div></div>';
  overlay.hidden = false;
  overlay.querySelector('[data-act="close"]').focus();
}

function show(i) {
  if (overlay.hidden) lastFocus = document.activeElement;
  cur = Math.max(0, Math.min(STEPS.length - 1, i));
  var s = STEPS[cur];
  overlay.innerHTML = '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">' +
    '<div class="dlg-head"><h2 id="dlgTitle"><span class="dlg-n">' + (cur + 1) + '</span>' + s.name + '</h2><button class="btn" type="button" data-act="close">Close</button></div>' +
    '<div class="dlg-body"><div class="dlg-text"><p>' + s.text + '</p></div><div class="dlg-diagram">' + buildDiagram(s) + '</div></div>' +
    '<div class="dlg-foot"><span class="count">' + (cur + 1) + ' of ' + STEPS.length + '</span>' +
    '<div class="grp"><button class="btn" type="button" data-act="prev"' + (cur === 0 ? ' disabled' : '') + '>Previous</button>' +
    '<button class="btn" type="button" data-act="next"' + (cur === STEPS.length - 1 ? ' disabled' : '') + '>Next</button></div></div></div>';
  overlay.hidden = false;
  setPressed(cur);
  overlay.querySelector('[data-act="close"]').focus();
}

figEl.addEventListener('click', function (e) {
  var g = e.target.closest ? e.target.closest('.hs') : null;
  if (g) show(Number(g.getAttribute('data-i')));
});
figEl.addEventListener('keydown', function (e) {
  var g = e.target.closest ? e.target.closest('.hs') : null;
  if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); show(Number(g.getAttribute('data-i'))); }
});
overlay.addEventListener('click', function (e) {
  if (e.target === overlay) { closeDialog(); return; }
  var b = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!b) return;
  var act = b.getAttribute('data-act');
  if (act === 'close') closeDialog();
  else if (act === 'prev') show(cur - 1);
  else if (act === 'next') show(cur + 1);
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !overlay.hidden) closeDialog(); });
introBtn.addEventListener('click', openIntro);
</script>
